<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icon.png" type="image/png">
    <title>Aula Imagens</title>
</head>
<body>
    <h1>Desafio das imagens - Cidade Natal</h1>
    <h3>Vila Velha</h3>
    <img src="vv1.jpg" alt="imagem de vila velha 1">
    <figure>
        <img src="vv2.jpg" alt="Convento da Penha">
        <figcaption>Convento da Penha - Vila Velha</figcaption>
    </figure>

    <picture>
        <source media="(max-width: 500px)" srcset="vv1.jpg" width="500px">
        <img src="vv3.jpg" alt="imagem de vila velha 3">
    </picture>
</body>
</html>
